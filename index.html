<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#003178" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO Meta Tags -->
    <title>DentMatch KE – Reverse-Recruitment for Dental Professionals</title>
    <meta
      name="description"
      content="Kenya's first reverse-recruitment platform connecting verified dental surgeons, orthodontists, and specialists with clinics. Featuring KMPDC verification and Safaricom Lipa Na M-Pesa escrow."
    />
    <meta name="keywords" content="dentist jobs Kenya, dental locum Nairobi, KMPDC verification, dental surgeon recruitment, Safaricom M-Pesa dental locum" />
    <meta name="author" content="DentMatch KE" />

    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DentMatch KE – Reverse-Recruitment for Dental Professionals" />
    <meta
      property="og:description"
      content="Connecting verified Kenyan dentists with top dental practices. Direct offers, transparent daily locum rates in KSh, and instant WhatsApp handshakes."
    />
    <meta property="og:site_name" content="DentMatch KE" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DentMatch KE – Dental Reverse-Recruitment in Kenya" />
    <meta
      name="twitter:description"
      content="KMPDC-verified dental talent marketplace with Safaricom Lipa Na M-Pesa escrow and direct reverse-recruitment."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DentMatch KE",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "All",
      "description": "Kenya's reverse-recruitment platform for verified dental professionals and licensed clinics.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KES"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "KE",
        "addressLocality": "Nairobi"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
